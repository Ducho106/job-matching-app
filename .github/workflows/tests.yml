name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      
      - name: Tests ausführen
        run: pytest