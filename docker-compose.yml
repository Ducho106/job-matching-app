services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: job_matching_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/job_matching_db
    depends_on:
      - db
    env_file:
      - .env